# CI per RUL-15: GitHub-hosted runner, the consumer's pinned tools image (named by digest in
# tests/spike.sh, which must follow Aethelgard main's container/IMAGE, RUL-09), and no network for
# any run: every container is started with --network none. Only the image pull uses the network.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TVIBURI_CI: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pull the pinned tools image, by digest
        run: podman pull "$(sed -n 's/^IMAGE=//p' tests/spike.sh)"
      - name: Acceptance suite
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/spike.sh
      # TVI-WO-1301 (ruled 2026-11-23T18:30Z, 19:08Z): Aethelgard's memory bound is judged here, on an unshared
      # runner. ArduPilot's ELF is built from Aethelgard's pinned image and held to its sha256; five full boots.
      - name: Pull Aethelgard's pinned ArduPilot image, by digest
        run: podman pull "$(sed -n 's/^AP_IMAGE=//p' tests/1301/ci-memory.sh)"
      # TEMPORARY (TVI-WO-1301, ruled 2026-11-23T20:20Z; removed before READY): main's file and 1301's, each with and
      # without Renode's .NET GC told to conserve memory, five boots each. The fetch of main is the only network use.
      - name: TEMPORARY memory measurement, four configurations
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/1301/ci-memory-gc.sh
      - name: Memory on ArduPilot's full boot (each peak 32 MiB under 1,048,576 KiB)
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/1301/ci-memory.sh
      - name: Adversarial cases
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/adversarial.sh
      - name: Mutation run (one mutant per guard this change adds; each must be killed)
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/mutants.sh
