# CI per RUL-15: GitHub-hosted runner, the consumer's pinned tools image (named by digest in
# tests/spike.sh, which must follow Aethelgard main's container/IMAGE, RUL-09), and no network for
# any run: every container is started with --network none. Only the image pull uses the network.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TVIBURI_CI: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # TVI-WO-1201: the memory budget compares HEAD with HEAD^1 (main's tip, under a pull request's merge commit).
          fetch-depth: 2
      - name: Pull the pinned tools image, by digest
        run: podman pull "$(sed -n 's/^IMAGE=//p' tests/spike.sh)"
      - name: Acceptance suite
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/spike.sh
      # TVI-WO-1201 (Scotty, 2026-11-23 evening): the memory budget, main's one file against this change's in this
      # one job. ArduPilot's ELF is built from Aethelgard's pinned image and held to its sha256; five full boots a
      # side, interleaved. Every branch boot at or under 1,572,864 KiB; the branch's median at most 32 MiB over main's.
      - name: Pull Aethelgard's pinned ArduPilot image, by digest
        run: podman pull "$(sed -n 's/^AP_IMAGE=//p' tests/1301/ci-memory.sh)"
      - name: Memory budget (this change against main, same job; median at most 32 MiB over, every boot under 1.5 GiB)
        env:
          TVIBURI_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/1301/ci-memory.sh
      - name: Memory budget's own tests (the judge; a planted 64 MiB branch refused by budget)
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/1201/test-budget.sh
      # TEMPORARY (TVI-WO-1201 §1.1; removed before READY): 1301's merged tree against the commit before it. A measurement.
      - name: TEMPORARY 1301 (d598442) against the commit before it (b019105)
        run: |
          git fetch -q --no-tags --depth=1 origin b0191054146a317415a7f23e266ab9874c74e493 d5984421bb5c688db6f2062f3248e0b5076bf957
          TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" TVIBURI_MEMORY_LABEL="§1.1 (temporary): 1301 d598442 against b019105" \
            tests/1301/ci-memory.sh b0191054146a317415a7f23e266ab9874c74e493 d5984421bb5c688db6f2062f3248e0b5076bf957 || true
      - name: Adversarial cases
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/adversarial.sh
      - name: Mutation run (one mutant per guard this change adds; each must be killed)
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/mutants.sh
