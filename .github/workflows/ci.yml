# CI per RUL-15: GitHub-hosted runner, the consumer's pinned tools image (named by digest in
# tests/spike.sh, which must follow Aethelgard main's container/IMAGE, RUL-09), and no network for
# any run: every container is started with --network none. Only the image pull uses the network.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TVIBURI_CI: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pull the pinned tools image, by digest
        run: podman pull "$(sed -n 's/^IMAGE=//p' tests/spike.sh)"
      - name: Acceptance suite
        run: TVIBURI_SCRATCH="$RUNNER_TEMP/tviburi" tests/spike.sh
